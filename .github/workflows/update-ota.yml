name: Build update packages for draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v1.6.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify the target is a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"
          is_draft="$(jq -r .isDraft <<< "$release")"
          target="$(jq -r .targetCommitish <<< "$release")"
          if [ "$is_draft" != "true" ]; then
            echo "The target release must exist as a draft." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            target_commit="$(git rev-parse --verify "${target}^{commit}" 2>/dev/null || true)"
            if [ -z "$target_commit" ]; then
              git fetch origin "$target"
              target_commit="$(git rev-parse FETCH_HEAD)"
            fi
            git tag "$RELEASE_TAG" "$target_commit"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Build full and incremental packages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/build_update_package.py "$RELEASE_TAG" "dist"

      - name: Attach packages to release
        if: hashFiles('dist/MoYomi-*.zip') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/MoYomi-*.zip --clobber
